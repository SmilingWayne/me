name: validate site with Zensical

on:
  push:
    branches:
      - migration
  pull_request:
    branches:
      - migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build with Zensical
        run: uv run zensical build --clean

      - name: Validate representative output
        run: uv run python scripts/validate_zensical_build.py

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: zensical-site
          path: site/
          if-no-files-found: error
          retention-days: 3
